name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Corre la suite con cobertura: falla si baja de los umbrales de vite.config.js.
      - run: npm run coverage
      # Con los `overrides` de package.json la auditoría queda limpia; esto evita
      # que entre una dependencia nueva con un aviso alto.
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run size
