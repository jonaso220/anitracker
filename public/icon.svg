<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>AniTracker</title>
  <!--
    Fuente de todos los íconos de la app. Los PNG y el favicon.ico se generan
    desde acá con `npm run icons` (scripts/generate-icons.mjs), que busca
    id="bg", id="glyph" e id="sparkle" para armar las variantes (a sangre,
    maskable y la simplificada de 16 px).
    El degradé es el de marca (gradient-brand en src/styles/theme.css).
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4ecdc4"/>
    </linearGradient>
  </defs>
  <rect id="bg" width="512" height="512" rx="116" fill="url(#brand)"/>
  <g id="glyph">
    <!-- Antenas -->
    <path d="M256 200 198 120M256 200l58-80" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
    <!-- Tele -->
    <rect x="100" y="190" width="312" height="226" rx="62" fill="#fff"/>
    <!-- Check de «visto»: deja ver el degradé del fondo -->
    <path d="m196 304 44 44 82-86" fill="none" stroke="url(#brand)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Destello (el favicon de 16 px lo omite: ahí es un punto borroso) -->
    <path id="sparkle" d="M392 82c4 26 10 32 36 36-26 4-32 10-36 36-4-26-10-32-36-36 26-4 32-10 36-36Z" fill="#fff"/>
  </g>
</svg>
